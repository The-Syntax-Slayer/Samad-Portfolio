<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Glowing Neon Gradient -->
    <linearGradient id="crown-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#8FFFD1" />
      <stop offset="100%" stop-color="#3BE8B0" />
    </linearGradient>
    
    <!-- Neon Glow filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Solid Premium Dark Background -->
  <rect width="120" height="120" rx="24" fill="#05080c" />

  <!-- Hexagonal Tech Chassis Frame (Faded background detail) -->
  <polygon points="60,10 104,35 104,85 60,110 16,85 16,35" 
           stroke="#8FFFD1" 
           stroke-width="1" 
           stroke-opacity="0.15" />
           
  <!-- Orbital Blueprint Ring -->
  <circle cx="60" cy="60" r="46" stroke="#8FFFD1" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="8 6 4 6" />

  <!-- Stylized Geometric Crown -->
  <!-- Base of the Crown (Structured code bracket base) -->
  <path d="M25 80 L95 80" stroke="#8FFFD1" stroke-width="4" stroke-linecap="round" stroke-opacity="0.3" />
  <path d="M30 84 L90 84" stroke="#8FFFD1" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.5" stroke-dasharray="4 4" />
  
  <!-- Main Crown Peaks (Five-point geometric crown outline) -->
  <path d="M25 80 L20 45 L42 62 L60 34 L78 62 L100 45 L95 80 Z" 
        stroke="url(#crown-grad)" 
        stroke-width="5.5" 
        stroke-linejoin="round" 
        stroke-linecap="round" 
        fill="#8FFFD1" 
        fill-opacity="0.05"
        filter="url(#neon-glow)" />

  <!-- Inner Tech Line Details (Circuit Board lines inside the crown) -->
  <path d="M42 62 L60 80 M78 62 L60 80 M60 34 L60 80" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Glowing Neural Connection Nodes at the Crown tips -->
  <circle cx="20" cy="45" r="3" fill="#FFFFFF" filter="url(#neon-glow)" />
  <circle cx="100" cy="45" r="3" fill="#FFFFFF" filter="url(#neon-glow)" />
  <circle cx="42" cy="62" r="2" fill="#8FFFD1" filter="url(#neon-glow)" />
  <circle cx="78" cy="62" r="2" fill="#8FFFD1" filter="url(#neon-glow)" />
  
  <!-- Central Glowing Diamond Core (The Crown Jewel / Precision Spark) -->
  <path d="M60 20 L65 26 L60 32 L55 26 Z" 
        fill="#FFFFFF" 
        stroke="#8FFFD1" 
        stroke-width="1" 
        filter="url(#neon-glow)" />
</svg>
